name: Build Mobile Apps (APK & IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build React Web App
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Assets
        run: |
          cd frontend
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: room-expense-tracker-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Workaround Git 128 error in Xcode SPM
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build React Web App
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Assets
        run: |
          cd frontend
          npx cap sync ios

      - name: Build iOS App (Unsigned)
        run: |
          cd frontend/ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -archivePath $PWD/build/App.xcarchive \
            clean archive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          cd frontend/ios/App
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r App.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: room-expense-tracker-ipa
          path: frontend/ios/App/build/App.ipa

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && success()
    permissions:
      contents: write
    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: room-expense-tracker-apk
          path: artifacts/apk

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: room-expense-tracker-ipa
          path: artifacts/ipa

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          find artifacts/apk -name "*.apk" -exec cp {} release-assets/RoomExpenseTracker-debug.apk \;
          find artifacts/ipa -name "*.ipa" -exec cp {} release-assets/RoomExpenseTracker.ipa \;
          ls -la release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" release-assets/* \
            --title "Release $TAG (Build #${{ github.run_number }})" \
            --notes "### 📱 Room Expense Tracker Mobile Builds

          Permanent download links (these do not expire):
          - **Android APK**: [\`RoomExpenseTracker-debug.apk\`](<https://github.com/${{ github.repository }}/releases/download/$TAG/RoomExpenseTracker-debug.apk>)
          - **iOS IPA**: [\`RoomExpenseTracker.ipa\`](<https://github.com/${{ github.repository }}/releases/download/$TAG/RoomExpenseTracker.ipa>)

          Built from commit: \`${{ github.sha }}\`"
